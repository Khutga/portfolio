<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ali Seyidzade</title>

    <meta name="description" content="Portfolio of Ali Seyidzade - Full Stack Developer.">

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.172.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.172.0/examples/jsm/",
                "gsap": "https://esm.sh/gsap"
            }
        }
    </script>

    <link rel="stylesheet" href="./css/style.css">


    <script type="module" src="./js/main.js"></script>
</head>

<body>
    <div id="preloader">
        <div class="loader-content">
            <div class="loader-diamond"></div>
            <div class="loader-text">LOADING...</div>
            <div class="loader-bar-container">
                <div class="loader-bar"></div>
            </div>
            <div class="loader-percentage">0%</div>
        </div>
    </div>
    <main id="side-panel">
        <button id="close-side-btn">&times;</button>
        <div class="content-wrapper">
            <h1 id="side-title">Başlık</h1>
            <p id="side-desc">İçerik metni buraya gelecek...</p>
        </div>
    </main>
    <div id="image-lightbox" class="image-modal">
        <img src="" alt="Preview">
    </div>
    <div id="interaction-hint">
    <div class="hint-scene">
        <svg class="crystal-icon" viewBox="0 0 24 24" fill="none" stroke="#00ffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L20 9L12 22L4 9L12 2Z" />
        </svg>
        
        <div class="contact-glow"></div>

        <svg class="hand-pointer" viewBox="0 0 24 24" fill="#000" stroke="#00ffff" stroke-width="2" stroke-linejoin="round">
            <path d="M18.5 10a2.5 2.5 0 0 0-5 0V3a2.5 2.5 0 0 0-5 0v8.5c0 3.5 2.5 6.5 6 6.5s6-3 6-6.5V10z"/>
        </svg>
    </div>
    
    <span class="hint-text">TAP TO CRYSTAL</span>
</div>
</div>

</body>

</html>
